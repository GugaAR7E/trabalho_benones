<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Adicione roupas no seu carrinho</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>Adicione roupas no seu carrinho:</h1>
    <form id="formAdicioneCarrinho">
        <label>Roupa:</label>
        <input type="text" id="roupa" name="roupa">
        <br><br>
        <label>Preço:</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" max="99999.99">
        <br><br>
        <label>Quantidade de peças: </label>
        <input type="number" id="quantidade" name="quantidade" step="0.01" min="0" max="99999.99">
        <br><br>
        <label>Data de Compra:</label>
        <input type="date" id="data_compra" name="data_compra">
        <br><br>
        <button type="submit">Adicione</button>
    </form>
    <div id="message"></div>

    <script src="criarVendaCombustivel.js"></script>
</body>

</html>
